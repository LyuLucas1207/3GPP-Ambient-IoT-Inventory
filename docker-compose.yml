# Development: bind-mount source, Vite HMR + Uvicorn --reload.
# Run from the repository root (LutzLampe/), not Implements/.
# Demo without hot reload: docker compose -f docker-compose.prod.yml up --build
name: ambient-iot-dev

services:
  backend:
    build:
      context: ./Implements/backend
      dockerfile: Dockerfile.dev
    pull_policy: missing
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
      WATCHFILES_FORCE_POLLING: "true"
    volumes:
      - ./Implements/backend:/app
      - ./Implements/results:/results
      - backend_venv_shadow:/app/.venv
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
      - --reload-dir
      - /app/simulator
      - --reload-dir
      - /app/scripts
      - --reload-dir
      - /app/tests

  frontend:
    build:
      context: ./Implements/frontend
      dockerfile: Dockerfile.dev
    pull_policy: missing
    ports:
      - "3000:3000"
    environment:
      VITE_API_PROXY: http://backend:8000
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./Implements/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "3000"]

volumes:
  frontend_node_modules:
  backend_venv_shadow:
