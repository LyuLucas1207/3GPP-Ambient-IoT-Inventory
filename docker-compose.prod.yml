# Production demo: baked images, no bind-mounts, no hot reload.
# Run from the repository root (LutzLampe/).
# Development: docker compose up --build
name: ambient-iot-prod

services:
  backend:
    build:
      context: ./Implements/backend
      dockerfile: Dockerfile
    pull_policy: missing
    ports:
      - "8000:8000"
    environment:
      PYTHONUNBUFFERED: "1"
    volumes:
      # Multi-reader training outputs and the policy registry live on the host,
      # so policies trained with `python -m training.train` show up without a rebuild.
      - ./Implements/backend/training/outputs:/app/training/outputs
      - ./Implements/backend/app/simulator_thesis/rl/policies:/app/app/simulator_thesis/rl/policies

  frontend:
    build:
      context: ./Implements/frontend
      dockerfile: Dockerfile
    pull_policy: missing
    ports:
      - "3000:80"
    depends_on:
      - backend
